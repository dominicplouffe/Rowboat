[package]
name = "rowboat"
version = "0.1.0"
description = "A fast, lightweight SQL client with an AI copilot that knows your schema."
authors = ["Dominic Plouffe"]
license = "MIT"
repository = "https://github.com/dominicplouffe/Rowboat"
edition = "2021"
default-run = "rowboat"

[lib]
name = "rowboat_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "rowboat"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "net", "time", "sync", "io-util", "macros"] }
tokio-postgres = "0.7.18"
tokio-postgres-rustls = "0.14.0"
rustls-pemfile = "2.2.0"
rustls-native-certs = "0.8.5"
uuid = { version = "1.26.1", features = ["v4"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rusqlite = { version = "0.43", features = ["bundled", "column_decltype", "column_metadata"] }
sqlparser = "0.64.0"
russh = { version = "0.65", default-features = false, features = ["ring", "flate2", "rsa"] }
keyring = "4"
futures-util = "0.3.34"
bytes = "1.12.1"
url = "2.5.8"
async-trait = "0.1.92"
chrono = "0.4.45"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "gzip", "zstd", "stream", "http2", "json", "query"] }
tokio-util = { version = "0.7.20", features = ["codec"] }

[dev-dependencies]
tempfile = "3"

[features]
# Integration tests that need the docker-compose services (PostgreSQL, ClickHouse).
integration = []

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
