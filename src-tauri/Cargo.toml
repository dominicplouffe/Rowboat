[package]
name = "rowboat"
version = "0.1.0"
description = "A fast, lightweight SQL client with an AI copilot that knows your schema."
authors = ["Dominic Plouffe"]
license = "MIT"
repository = "https://github.com/dominicplouffe/Rowboat"
edition = "2021"
rust-version = "1.85"
default-run = "rowboat"

[lib]
name = "rowboat_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "rowboat"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
tempfile = "3"

[features]
# Integration tests that need the docker-compose services (PostgreSQL, ClickHouse).
integration = []

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
