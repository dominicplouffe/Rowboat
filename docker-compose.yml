# PostgreSQL and ClickHouse for local development and integration tests.
#
#   docker compose up -d --wait
#   cargo test --manifest-path src-tauri/Cargo.toml --features integration
#   docker compose down -v
#
# CI runs the same images as service containers (see .github/workflows/ci.yml).
# The credentials below are throwaway test values for containers that only
# listen on localhost. Never use them anywhere real.

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: rowboat
      POSTGRES_PASSWORD: rowboat
      POSTGRES_DB: rowboat_test
    ports:
      - '127.0.0.1:5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U rowboat -d rowboat_test']
      interval: 2s
      timeout: 5s
      retries: 30

  clickhouse:
    image: clickhouse/clickhouse-server:26.8
    environment:
      CLICKHOUSE_USER: rowboat
      CLICKHOUSE_PASSWORD: rowboat
      CLICKHOUSE_DB: rowboat_test
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: '1'
    ports:
      - '127.0.0.1:8123:8123'
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:8123/ping || exit 1']
      interval: 2s
      timeout: 5s
      retries: 30
