name: Set up the Rowboat toolchain
description: Installs system libraries (Linux), Node, Rust and npm dependencies, with caching.

inputs:
  rust-targets:
    description: Extra Rust targets to install (comma-separated).
    default: ''
  rust-components:
    description: Extra Rust components to install (comma-separated).
    default: ''

runs:
  using: composite
  steps:
    - name: Install Linux build dependencies
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          build-essential pkg-config file patchelf rpm xvfb \
          libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
          librsvg2-dev libssl-dev libxdo-dev

    - uses: actions/setup-node@v7
      with:
        node-version: 22
        cache: npm

    - uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ inputs.rust-targets }}
        components: ${{ inputs.rust-components }}

    - uses: Swatinem/rust-cache@v2
      with:
        workspaces: src-tauri

    - name: Install npm dependencies
      shell: bash
      run: npm ci
